name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Hard gate: lint, types, unit tests, dbt build + data tests over synthetic fixtures.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,models,orchestration]"
      - name: Ruff
        run: ruff check src tests && ruff format --check src tests
      - name: Mypy
        run: mypy src
      - name: Fixtures are current
        run: bastion fixtures --check
      - name: Unit tests (no network)
        run: pytest -q
      - name: dbt build over fixtures
        env:
          BASTION_DATA: ${{ runner.temp }}/bastion
        run: bastion build --target ci
