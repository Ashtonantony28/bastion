[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion"
version = "0.1.0"
description = "Bank risk and analytics platform on public data: credit, market, liquidity/ALM, fraud/AML, stress testing, model risk management."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "polars>=1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "pyarrow>=15",
  "requests>=2.31",
  "pyyaml>=6",
  "dbt-core>=1.8,<2",
  "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
models = ["scikit-learn>=1.4", "statsmodels>=0.14", "lightgbm>=4.3"]
orchestration = ["dagster>=1.7"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-requests", "types-PyYAML"]

[project.scripts]
bastion = "bastion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bastion = ["ingest/pins.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not network\""
markers = ["network: needs internet access to public data sources (deselected in CI)"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
